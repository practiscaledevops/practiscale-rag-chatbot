<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1512" />
    <title>Offline — PractiScale Assistant</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070F0D; color: #EDF7F2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
      .mark { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { color: #91AAA0; font-size: 14px; line-height: 1.5; max-width: 34ch; margin: 0 auto 20px; }
      button { background: #20C8B5; color: #06100D; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:hover { background: #2DDCCD; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img class="mark" src="/icon-192.png" alt="" />
        <h1>You're offline</h1>
        <p>The Assistant needs a connection to reach the PractiScale Brain. Your conversations are safe — reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
